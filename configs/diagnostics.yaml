# Error analysis, slices and robustness checks of the system chosen in homework 2 (homework 3).
# Nothing is rendered and no constant of the model or of the detector is changed: the measurement and
# the scoring are those of configs/inpass.yaml.
extends: configs/inpass.yaml
name: diagnostics

source: results/inpass       # the scored rows that are analysed (and results/baseline through them)
system: swap_anchor_steer    # the chosen system
analysis_set: test           # the evaluation set of homework 2
reference: stitch            # shown next to the chosen system where the same miss is looked for

# A missed row with a step of the right size and sign is split further by where the two estimators of
# the change-point put it (src/emoswitch/diagnose.py). `weighted` is the estimator of the sensitivity
# analysis of homework 1; the detector keeps the plain one.
slices:
  seconds_after_boundary: 3    # equal-count groups of the time from the boundary to the end of the clip
  seconds_before_boundary: 3
  commanded_step: [0.25, 0.35, 0.45]   # edges of the groups of the commanded step

# Robustness check 1: white noise added to the released clip before it is measured.
noise:
  conditions: [swap_anchor_steer, swap_null]
  set: test
  snr_db: [30, 20, 10, 0]
  seed: 0
  audio_root: data/audio_perturbed   # regenerated by src/emoswitch/perturb.py, not in git

# Robustness check 2: the same renders, other seeds and other subsets of phrases.
resample:
  half_splits: all             # every split of the phrases of the set into two halves

# Robustness check 3 (docs/plan_hw3_render.md): the chosen system and its no-switch rows rendered again
# with the same code and checkpoint on other hardware (CPU, float32; homework 2 was rendered on CUDA in
# bfloat16), with the seed of a homework 2 run and with new seeds.
rerender:
  set: test
  conditions: [swap_anchor_steer, swap_null]
  seeds: [42, 45, 46]
  device: cpu
  manifest: data/manifest_rerender.jsonl
  audio_root: data/audio            # released as FLAC under <audio_root>/rerender_<set>_s<seed>/
  wav_root: data/audio_rendered     # the rendered wav files, not in git
