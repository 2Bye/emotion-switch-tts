[project]
name = "emoswitch"
version = "0.1.0"
description = "Intra-utterance emotion switching in TTS: task statement, baseline and evaluation protocol"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "transformers==4.57.3",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.2",
    "librosa==0.11.0",
    "pyloudnorm==0.2.0",
    "soundfile==0.14.0",
    "jiwer==4.0.0",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
# Rendering the baseline needs a GPU, the vendor TTS package and the fine-tuned checkpoint.
gen = ["qwen-tts==0.1.1", "accelerate"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/emoswitch"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["models: re-measures released clips; needs the judge, aligner and ASR weights"]
addopts = "-m 'not models'"
